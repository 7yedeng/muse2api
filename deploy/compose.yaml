# Linux host networking preserves the admin listener's loopback boundary.
# Use the native binary on Windows; Docker Desktop is not claimed tested.
services:
  muse2api:
    build:
      context: ..
      dockerfile: Dockerfile
    network_mode: host
    user: "${MUSE2API_UID:-1000}:${MUSE2API_GID:-1000}"
    env_file:
      - ../.env
    environment:
      MUSE2API_DATA_DIR: /app/runtime
      MUSE2API_ADMIN_LISTEN: 127.0.0.1:18689
    volumes:
      - ../runtime:/app/runtime
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
