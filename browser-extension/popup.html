<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Muse2API 本机授权</title>
<style>
body{font:14px/1.6 system-ui,sans-serif;width:340px;padding:18px;margin:0;color:#17202a;background:#f7f8fa}h1{font-size:19px;margin:0 0 12px}label{display:block;margin-top:12px}input{box-sizing:border-box;width:100%;padding:9px;border:1px solid #adb5bd;border-radius:6px}button{width:100%;padding:10px;margin-top:16px;border:0;border-radius:6px;color:white;background:#175cd3;cursor:pointer}button:disabled{opacity:.5}p{margin:10px 0}.small{font-size:12px;color:#52606d}#status{white-space:pre-wrap;overflow-wrap:anywhere}
</style>
<h1>授权本机 Muse2API</h1>
<p>先在当前标签页正常登录 <a href="https://muse.ai/" target="_blank" rel="noreferrer">Muse</a>。在你自己的本机管理页获取一次性授权码，再点击下方按钮。</p>
<label>本机管理端口 <input id="port" type="number" min="1024" max="65535" value="18689"></label>
<label>一次性授权码 <input id="code" type="password" autocomplete="off" spellcheck="false"></label>
<p class="small">本次仅读取三个指定的 Muse 会话 Cookie，发送到 127.0.0.1；扩展不保存会话，不读取密码或整个浏览器资料。这是社区会话交接方式，并非 Meta OAuth。</p>
<button id="authorize" type="button">读取指定会话并授权本机</button>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="popup.mjs"></script>
</html>
